# Artivault — single-container deployment (API + GUI on one origin).
# All configuration lives in .env.docker (copy it from .env.docker.example):
#
#   cp .env.docker.example .env.docker            # then edit the secrets
#   docker compose --env-file .env.docker up -d --build
#
# Create the first admin (prints an invitation link to open in a browser):
#   docker compose exec app node server/dist/cli/create-user.js --email you@example.com --admin
#   docker compose exec app node server/dist/cli/invite.js      --email you@example.com  # re-issue

services:
  app:
    build:
      context: .
      args:
        NODE_VERSION: "${NODE_VERSION:-26}"
    image: artivault:local
    restart: unless-stopped
    # Injects the whole file (secrets, origin, RP, …) into the container.
    env_file:
      - .env
    environment:
      # Container invariants — fixed here so they can't be misconfigured.
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /data
      # Listen port, kept in sync with the published port below and defaulted so
      # the stack runs before any editing. Health check lives in the image.
      PORT: "${PORT:-8787}"
    ports:
      - "${PORT:-8787}:${PORT:-8787}"
    volumes:
      - artivault-data:/data

volumes:
  artivault-data:
